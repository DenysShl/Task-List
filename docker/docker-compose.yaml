version: '3.9'

networks:
  app:
    driver: bridge

volumes:
  db-data:
    driver: local

services:
  postgres_db:
    container_name: postgres_container
    image: 'postgres:15.1-alpine'
    networks:
      - app
    env_file:
      - .env
    ports:
      - '5437:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always
