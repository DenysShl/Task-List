version: '3'

networks:
  app-network:
    driver: bridge

volumes:
    redis-data:
      driver: local
    postgres-data:
      driver: local
    minio-data:
      driver: local

services:
  app:
    build:
      context: .
    container_name: tasklist
    networks:
      - app-network
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/task_list_db?currentSchema=task_list_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - '8181:8181'

  postgres:
    image: postgres:15.1-alpine
    container_name: postgres_container
    env_file:
      - .env
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./src/main/resources/db-init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.2.1-alpine
    container_name: redis_container
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD} #commmand for start
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: minio_container
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    command: server ~/minio --console-address :9090
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - minio-data:/minio