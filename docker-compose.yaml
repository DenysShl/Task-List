version: '3'

networks:
  app-network:
    driver: bridge

volumes:
    redis-data:
      driver: local
    postgres-data:
      driver: local
    minio-data:
      driver: local
    prometheus_data: { }
    grafana_data: { }
    cadvisor_data: { }
    alertmanager_data: { }

services:
  app:
    build:
      context: .
    container_name: tasklist
    networks:
      - app-network
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/task_list_db?currentSchema=task_list_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - '8181:8181'

  postgres:
    image: postgres:15.1-alpine
    container_name: postgres_container
    env_file:
      - .env
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./src/main/resources/db-init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.2.1-alpine
    container_name: redis_container
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD} #commmand for start
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: minio_container
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    command: server ~/minio --console-address :9090
    ports:
      - "9000:9000"
      - "9091:9090"
    volumes:
      - minio-data:/minio

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_container
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - cadvisor
    labels:
      org.label-schema.group: "monitoring"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter_container
    restart: unless-stopped
    ports:
      - "9100:9100"
    labels:
      org.label-schema.group: "monitoring"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_container
    env_file:
      - ./.env
    environment:
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-piechart-panel
      - GF_SECURITY_ADMIN_USER=${ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    labels:
      org.label-schema.group: "monitoring"

  alert-manager:
    image: prom/alertmanager:latest
    container_name: alert-manager_container
    env_file:
      - ./.env
    environment:
      - GF_SECURITY_ADMIN_USER=${ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_data:/etc/alertmanager
      - ./alert.rules:/etc/alertmanager/alert.rules
    depends_on:
      - prometheus
    labels:
      org.label-schema.group: "monitoring"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor_container
    restart: unless-stopped
    ports:
      - "9190:9190"
    volumes:
      - cadvisor_data:/var/lib/cadvisor
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - prometheus-grafana
    labels:
      org.label-schema.group: "monitoring"