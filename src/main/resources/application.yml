spring:
  application:
    name: Task-List

  config:
    import: optional:file:.env[.properties]
  datasource:
#    url: jdbc:postgresql://${HOST}:${HOST_PORT}/${POSTGRES_DB}?currentSchema=${POSTGRES_DB}
#    url: jdbc:postgresql://${HOST}:${HOST_PORT}/${POSTGRES_DB}?schema=public
    url: jdbc:postgresql://localhost:5432/task_list_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      continue-on-error: false
      data-locations: classpath:demo_data.sql
