logging:
  level:
    #    root: DEBUG
    root: INFO
    org:
      hibernate:
        SQL: INFO
        type: INFO
      springframework:
        security: INFO
  file:
    name: "./logs/task.log"
  pattern:
    file: "%date{HH:mm:ss.SSS} | %5p | ${spring.application.name:} | %X{traceId} | %X{spanId} | %X{Session-ID} |
      %X{clientIp} | [%F@%M:>-%L] - %m%n %throwable{full}"
    console: "%yellow(%d{ISO8601}) | %highlight(%level) | %green(${spring.application.name:}) | 
      %red(%X{traceId}) | %X{spanId} | %highlight(%X{Session-ID}) | %green([%F@%M:>-%L]) - %msg %red(%throwable{full}%n)"
